[project]
name = "ngage"
version = "0.7.0"
requires-python = ">=3.14"
dependencies = [
    "chardet>=5.2.0",
    "customtkinter==5.2.2",
    "darkdetect==0.8.0",
    "et-xmlfile==2.0.0",
    "numpy==2.5.0",
    "openpyxl==3.1.5",
    "packaging==26.2",
    "pandas==2.3.3",
    "pillow>=12.0.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2026.2",
    "six==1.17.0",
    "toml==0.10.2",
    "tzdata==2026.2",
    "xlsxwriter==3.2.9",
]

[dependency-groups]
code = ["black>=25.9.0", "isort>=6.0.1", "ruff>=0.13.2"]
dev = [
    "ipykernel>=6.29.4",
    "ipython>=8.23.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.15.1",
]

[tool.black]
line-length = 120
target-version = ['py314']
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "debug.py",
    "build",
    "dist",
    "__pycache__",
    ".venv",
    "venv",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.so",
    "*.dylib",
    "*.dll",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = ["D212", "D107"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"debug*.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -vv --cov=lib --cov=models --cov=config --cov=helper --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
